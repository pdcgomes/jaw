name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  data-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/check-data-audit.py "$BASE" "$GITHUB_SHA"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '0' }}
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        main:
          - ${{ github.event_name == 'workflow_dispatch' }}
        # macOS minutes count ten times on a private repository: macOS runs only by hand.
        exclude:
          - os: macos-latest
            main: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # cpal reaches ALSA on Linux; libopus builds with the runners' own cmake.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: make lint
      - run: make test
      - run: make check-generated
