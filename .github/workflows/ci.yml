name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  data-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/check-data-audit.py "$BASE" "$GITHUB_SHA"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '0' }}
  # Every request and push the terminal uses that the Mac doesn't has a step of the Mac's parity plan.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-parity.py
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        main:
          - ${{ github.event_name == 'workflow_dispatch' }}
        # macOS minutes count ten times on a private repository: macOS runs only by hand.
        exclude:
          - os: macos-latest
            main: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # cpal reaches ALSA on Linux; libopus builds with the runners' own cmake.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # jaw-media's tests run ffmpeg: on Linux a static build, since HEIC needs 7.1 or newer and
      # Ubuntu's is older; on macOS Homebrew's, which has VideoToolbox.
      - name: ffmpeg
        if: runner.os == 'Linux'
        run: |
          curl -sSfL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-n8.1-latest-linux64-gpl-8.1/bin" >> "$GITHUB_PATH"
      - name: ffmpeg
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - uses: jdx/mise-action@v2
      - run: mise run lint
      - run: mise run test
      - run: mise run check-generated
