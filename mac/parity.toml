# What the terminal asks of jawd that the Mac doesn't yet, each with the step of the parity plan
# (docs/plans/2026-10-27-jaw-mac-parity-plan.md) that brings it. `mise run check-parity` fails when
# the terminal uses a request or push this list doesn't have, and when the Mac uses one it still
# holds, so a step takes its rows out as it lands. A row can come before the terminal on main uses
# it, from a branch it's being built on; one whose name main's protocol doesn't have yet says that
# branch.

[requests]
"layout.set" = "1.1"
"voice.play" = "2.6"
"voice.pause" = "2.6"
"voice.seek" = "2.6"
"voice.speed" = "2.6"
"voice.record" = "2.7"
"voice.stop" = "2.7"
"voice.send" = "2.7"
"voice.cancel" = "2.7"
"star" = "3.2"
"settings.set" = "3.5"
"chat.disappearing" = "3.11"
"view_once.open" = "3.11"
"view_once.close" = "3.11"

[pushes]
"layout" = "1.1"
"playback" = "2.6"
"recording" = "2.7"
"presence" = "3.1"
"settings" = "3.5"

# What the terminal uses that the Mac never will, each with why:
# [not_for_the_mac]
# "name" = "why"
