// The link between jawd and jaw-engine: Frames on the engine's standard input and output, each its
// length (four bytes, big-endian) and then the protobuf, at most 16 MiB; the engine's logs go to
// standard error. Go's code is generated by `make proto` and committed; Rust's is generated at
// build time by crates/wa-proto with protox.
//
// The engine stays thin: it hands jawd what whatsmeow received, with WhatsApp's own protobufs as
// they came, and carries out jawd's commands. Fields are only ever added; anything else raises
// Version.
syntax = "proto3";

package jaw.engine;

option go_package = "github.com/pdcgomes/jaw/engine/internal/link/enginepb";

enum Version {
  VERSION_UNSPECIFIED = 0;
  VERSION_CURRENT = 1;
}

// One message on the link. A command's reply carries the command's id; nothing else needs one.
message Frame {
  uint64 id = 1;
  oneof body {
    Hello hello = 2;
    Event event = 3;
    Ack ack = 4;
    Command command = 5;
    Reply reply = 6;
  }
}

// The first frame each way. jawd refuses an engine whose protocol isn't its own.
message Hello {
  uint32 protocol = 1;
  // The program and its version, such as "jaw-engine 0.1.0".
  string program = 2;
  // The whatsmeow version the engine was built with, which proto/whatsapp/VERSION must match.
  string whatsmeow = 3;
}

// ---------------------------------------------------------------- from the engine

// An event with a seq must be stored before WhatsApp hears it arrived: the engine waits for jawd's
// Ack with that seq before it lets whatsmeow acknowledge it. Events without one are fire and forget.
message Event {
  uint64 seq = 1;
  oneof kind {
    Connection connection = 2;
    Link link = 3;
    Message message = 4;
    Receipt receipt = 5;
    OfflinePreview offline_preview = 6;
    OfflineDone offline_done = 7;
    Bench bench = 8;
  }
}

message Connection {
  enum State {
    STATE_UNSPECIFIED = 0;
    // No account is linked; LinkStart links one.
    UNLINKED = 1;
    CONNECTING = 2;
    CONNECTED = 3;
    DISCONNECTED = 4;
    // The phone removed this device, or WhatsApp did: `reason` says which.
    LOGGED_OUT = 5;
    // Another client connected with this device's session.
    STREAM_REPLACED = 6;
    // WhatsApp wants a newer client: whatsmeow needs updating.
    CLIENT_OUTDATED = 7;
    TEMPORARY_BAN = 8;
    CONNECT_FAILED = 9;
    KEEPALIVE_TIMEOUT = 10;
  }
  State state = 1;
  string reason = 2;
  // When a temporary ban ends, in milliseconds since the epoch.
  int64 until_ms = 3;
  // The linked account, once there is one.
  string jid = 4;
  string lid = 5;
  string push_name = 6;
}

message Link {
  oneof step {
    QrCode qr = 1;
    // The code to type on the phone, when linking by phone number.
    string code = 2;
    Linked done = 3;
    // Why linking stopped, as a sentence.
    string failed = 4;
  }
}

message QrCode {
  string code = 1;
  // When this code stops working; the next one follows.
  int64 expires_ms = 2;
}

message Linked {
  string jid = 1;
  string lid = 2;
  string push_name = 3;
  string platform = 4;
  string business_name = 5;
}

// A message as whatsmeow received it, live or from an unavailable-message request.
message Message {
  MessageInfo info = 1;
  // WhatsApp's Message protobuf (WAWebProtobufsE2E.Message) as it came, still in its wrappers.
  bytes raw = 2;
  // What the engine decrypted with a secret whatsmeow keeps: a poll update's PollVoteMessage, or an
  // encrypted reaction's ReactionMessage.
  bytes decrypted = 3;
  uint32 retry_count = 4;
  string unavailable_request = 5;
}

// whatsmeow's types.MessageInfo.
message MessageInfo {
  string chat = 1;
  string sender = 2;
  bool from_me = 3;
  bool group = 4;
  string addressing_mode = 5;
  string sender_alt = 6;
  string recipient_alt = 7;
  string broadcast_owner = 8;
  string id = 9;
  uint32 server_id = 10;
  string type = 11;
  string push_name = 12;
  int64 timestamp_ms = 13;
  string category = 14;
  bool multicast = 15;
  string media_type = 16;
  string edit = 17;
  string device_sent_destination = 18;
  string verified_name = 19;
}

// whatsmeow's events.Receipt.
message Receipt {
  string chat = 1;
  string sender = 2;
  bool from_me = 3;
  bool group = 4;
  string sender_alt = 5;
  repeated string ids = 6;
  int64 timestamp_ms = 7;
  // delivered (empty), read, read-self, played, played-self, sender, retry, inactive, …
  string type = 8;
  string message_sender = 9;
}

// What waits after time offline, before any of it arrives.
message OfflinePreview {
  uint32 total = 1;
  uint32 messages = 2;
  uint32 receipts = 3;
  uint32 notifications = 4;
  uint32 app_data_changes = 5;
}

message OfflineDone {
  uint32 count = 1;
}

// A made-up message for measuring the link, sent with a seq like a real one.
message Bench {
  bytes payload = 1;
}

// jawd has stored the event with this seq.
message Ack {
  uint64 seq = 1;
}

// ---------------------------------------------------------------- from jawd

message Command {
  oneof kind {
    Ping ping = 1;
    LinkStart link_start = 2;
    LinkCancel link_cancel = 3;
    Logout logout = 4;
    HistoryDownload history_download = 5;
    BenchRun bench_run = 6;
  }
}

message Ping {}

// Links an account: by QR code, or by a code typed on the phone when `phone` is given.
message LinkStart {
  // The phone number, in international form with no plus or spaces.
  string phone = 1;
}

message LinkCancel {}

message Logout {}

// Downloads one history blob, from the HistorySyncNotification inside a message jawd stored, and
// writes the decompressed HistorySync to `path`.
message HistoryDownload {
  // WAWebProtobufsE2E.HistorySyncNotification.
  bytes notification = 1;
  string path = 2;
}

// Sends `count` Bench events of `size` bytes, each waiting for its Ack as a message does.
message BenchRun {
  uint32 count = 1;
  uint32 size = 2;
}

message Reply {
  oneof kind {
    Failure failure = 1;
    Done done = 2;
    Pong pong = 3;
    HistoryFile history_file = 4;
    BenchResult bench_result = 5;
  }
}

message Failure {
  // A sentence jawd can pass on as it is.
  string message = 1;
  // Whether trying again later might work.
  bool retry = 2;
}

message Done {}

message Pong {
  int64 at_ms = 1;
}

message HistoryFile {
  string path = 1;
  // WAWebProtobufsHistorySync.HistorySync.HistorySyncType.
  int32 type = 2;
  uint32 chunk_order = 3;
  uint32 progress = 4;
  uint64 bytes = 5;
  uint32 conversations = 6;
}

// Round trips as the engine measured them, from sending each Bench event to its Ack.
message BenchResult {
  uint32 count = 1;
  uint64 elapsed_us = 2;
  uint64 p50_us = 3;
  uint64 p99_us = 4;
  uint64 max_us = 5;
}
