// The link between jawd and jaw-engine: length-prefixed Frames on the engine's standard input and
// output, its logs on standard error. Go's code is generated by `make proto` and committed;
// Rust's is generated at build time by crates/wa-proto with protox.
syntax = "proto3";

package jaw.engine;

option go_package = "github.com/pdcgomes/jaw/engine/internal/link/enginepb";

// One message on the link. A request's reply carries its id; events carry none.
message Frame {
  uint64 id = 1;
  oneof body {
    Hello hello = 2;
  }
}

// The first frame each way. jawd refuses an engine whose protocol isn't its own.
message Hello {
  uint32 protocol = 1;
  // The program and its version, such as "jaw-engine 0.1.0".
  string program = 2;
  // The whatsmeow version the engine was built with, which proto/whatsapp/VERSION must match.
  string whatsmeow = 3;
}
