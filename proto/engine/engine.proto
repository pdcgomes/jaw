// The link between jawd and jaw-engine: Frames on the engine's standard input and output, each its
// length (four bytes, big-endian) and then the protobuf, at most 16 MiB; the engine's logs go to
// standard error. Go's code is generated by `make proto` and committed; Rust's is generated at
// build time by crates/wa-proto with protox.
//
// The engine stays thin: it hands jawd what whatsmeow received, with WhatsApp's own protobufs as
// they came, and carries out jawd's commands. Fields are only ever added; anything else raises
// Version.
syntax = "proto3";

package jaw.engine;

option go_package = "github.com/pdcgomes/jaw/engine/internal/link/enginepb";

enum Version {
  VERSION_UNSPECIFIED = 0;
  VERSION_CURRENT = 1;
}

// One message on the link. A command's reply carries the command's id; nothing else needs one.
message Frame {
  uint64 id = 1;
  oneof body {
    Hello hello = 2;
    Event event = 3;
    Ack ack = 4;
    Command command = 5;
    Reply reply = 6;
  }
}

// The first frame each way. jawd refuses an engine whose protocol isn't its own.
message Hello {
  uint32 protocol = 1;
  // The program and its version, such as "jaw-engine 0.1.0".
  string program = 2;
  // The whatsmeow version the engine was built with, which proto/whatsapp/VERSION must match.
  string whatsmeow = 3;
}

// ---------------------------------------------------------------- from the engine

// An event with a seq must be stored before WhatsApp hears it arrived: the engine waits for jawd's
// Ack with that seq before it lets whatsmeow acknowledge it. Events without one are fire and forget.
message Event {
  uint64 seq = 1;
  oneof kind {
    Connection connection = 2;
    Link link = 3;
    Message message = 4;
    Receipt receipt = 5;
    OfflinePreview offline_preview = 6;
    OfflineDone offline_done = 7;
    Bench bench = 8;
    AppState app_state = 9;
    PushName push_name = 10;
    GroupInfo group = 11;
    GroupChange group_change = 12;
    Picture picture = 13;
    AppStateSynced app_state_synced = 14;
    PresenceUpdate presence = 15;
    Typing typing = 16;
    MediaProgress media_progress = 17;
    MediaRetried media_retried = 18;
  }
}

message Connection {
  enum State {
    STATE_UNSPECIFIED = 0;
    // No account is linked; LinkStart links one.
    UNLINKED = 1;
    CONNECTING = 2;
    CONNECTED = 3;
    DISCONNECTED = 4;
    // The phone removed this device, or WhatsApp did: `reason` says which.
    LOGGED_OUT = 5;
    // Another client connected with this device's session.
    STREAM_REPLACED = 6;
    // WhatsApp wants a newer client: whatsmeow needs updating.
    CLIENT_OUTDATED = 7;
    TEMPORARY_BAN = 8;
    CONNECT_FAILED = 9;
    KEEPALIVE_TIMEOUT = 10;
    // After KEEPALIVE_TIMEOUT, WhatsApp answers the keepalive again, on the same connection.
    KEEPALIVE_RESTORED = 11;
  }
  State state = 1;
  string reason = 2;
  // When a temporary ban ends, in milliseconds since the epoch.
  int64 until_ms = 3;
  // The linked account, once there is one.
  string jid = 4;
  string lid = 5;
  string push_name = 6;
}

message Link {
  oneof step {
    QrCode qr = 1;
    // The code to type on the phone, when linking by phone number.
    string code = 2;
    Linked done = 3;
    // Why linking stopped, as a sentence.
    string failed = 4;
  }
}

message QrCode {
  string code = 1;
  // When this code stops working; the next one follows.
  int64 expires_ms = 2;
}

message Linked {
  string jid = 1;
  string lid = 2;
  string push_name = 3;
  string platform = 4;
  string business_name = 5;
}

// A message as whatsmeow received it, live or from an unavailable-message request.
message Message {
  MessageInfo info = 1;
  // WhatsApp's Message protobuf (WAWebProtobufsE2E.Message) as it came, still in its wrappers.
  bytes raw = 2;
  // What the engine decrypted with a secret whatsmeow keeps: a poll update's PollVoteMessage, or an
  // encrypted reaction's ReactionMessage.
  bytes decrypted = 3;
  uint32 retry_count = 4;
  string unavailable_request = 5;
}

// whatsmeow's types.MessageInfo.
message MessageInfo {
  string chat = 1;
  string sender = 2;
  bool from_me = 3;
  bool group = 4;
  string addressing_mode = 5;
  string sender_alt = 6;
  string recipient_alt = 7;
  string broadcast_owner = 8;
  string id = 9;
  uint32 server_id = 10;
  string type = 11;
  string push_name = 12;
  int64 timestamp_ms = 13;
  string category = 14;
  bool multicast = 15;
  string media_type = 16;
  string edit = 17;
  string device_sent_destination = 18;
  string verified_name = 19;
}

// whatsmeow's events.Receipt.
message Receipt {
  string chat = 1;
  string sender = 2;
  bool from_me = 3;
  bool group = 4;
  string sender_alt = 5;
  repeated string ids = 6;
  int64 timestamp_ms = 7;
  // delivered (empty), read, read-self, played, played-self, sender, retry, inactive, …
  string type = 8;
  string message_sender = 9;
}

// What waits after time offline, before any of it arrives.
message OfflinePreview {
  uint32 total = 1;
  uint32 messages = 2;
  uint32 receipts = 3;
  uint32 notifications = 4;
  uint32 app_data_changes = 5;
}

message OfflineDone {
  uint32 count = 1;
}

// One app-state mutation, as whatsmeow decoded it: pin, archive, mute, mark read or unread, star,
// delete for me, a contact's name, the account's own name and the rest. Sent with a seq, since
// whatsmeow won't send it again.
message AppState {
  // The mutation's index, such as ["pin_v1", "351910000001@s.whatsapp.net"].
  repeated string index = 1;
  // WAWebProtobufSyncAction.SyncActionValue.
  bytes value = 2;
}

// An app-state collection whatsmeow has synced in full; its mutations came before this.
message AppStateSynced {
  string name = 1;
  uint64 version = 2;
}

// Someone's push name, which whatsmeow saw change on a message. Sent with a seq.
message PushName {
  string jid = 1;
  // Their other JID, LID or phone number, when whatsmeow knows it.
  string jid_alt = 2;
  string push_name = 3;
}

// A group as whatsmeow's types.GroupInfo describes it: one jaw joined (sent with a seq), or one
// of GetJoinedGroups' answers.
message GroupInfo {
  string jid = 1;
  string name = 2;
  string topic = 3;
  string owner = 4;
  int64 created_ms = 5;
  bool announce = 6;
  bool locked = 7;
  // The disappearing-message timer, or 0 for off.
  uint32 ephemeral_seconds = 8;
  // A community, whose groups name it in linked_parent.
  bool is_parent = 9;
  string linked_parent = 10;
  // A community's announcement group.
  bool is_default_sub = 11;
  string addressing_mode = 12;
  repeated Participant participants = 13;
}

message Participant {
  // The JID to message them on: their LID or their phone number's.
  string jid = 1;
  string phone = 2;
  string lid = 3;
  bool admin = 4;
  bool super_admin = 5;
  // An obfuscated number, for anonymous members of announcement groups.
  string display_name = 6;
}

// What changed in a group, as whatsmeow's events.GroupInfo says. Sent with a seq.
message GroupChange {
  string jid = 1;
  string sender = 2;
  string sender_pn = 3;
  int64 timestamp_ms = 4;
  optional string name = 5;
  optional string topic = 6;
  optional bool announce = 7;
  optional bool locked = 8;
  optional uint32 ephemeral_seconds = 9;
  bool deleted = 10;
  // A group linked to or unlinked from this community.
  string linked = 11;
  string unlinked = 12;
  repeated string join = 13;
  repeated string leave = 14;
  repeated string promote = 15;
  repeated string demote = 16;
}

// A user's or group's picture changed. Sent with a seq.
message Picture {
  string jid = 1;
  string author = 2;
  int64 timestamp_ms = 3;
  bool removed = 4;
  string picture_id = 5;
}

// Someone's presence, which WhatsApp sends, for those SubscribePresence asked for, while the
// account is online: around, or away and when they were last seen, unless they hide it.
message PresenceUpdate {
  string jid = 1;
  bool unavailable = 2;
  // 0 when they hide it, or WhatsApp didn't say.
  int64 last_seen_ms = 3;
}

// Someone typing or recording in a chat, or stopping, as WhatsApp tells it.
message Typing {
  string chat = 1;
  string sender = 2;
  ChatPresence.State state = 3;
}

// How far a MediaDownload has got: `bytes` of the `size` its message gave. Sent without a seq, at
// most four times a second for each download, and once more when it's whole.
message MediaProgress {
  string id = 1;
  uint64 bytes = 2;
  uint64 size = 3;
}

// The phone's answer to a MediaRetry, read with the key it was asked with. Sent with a seq, since
// the phone won't upload the file again unasked.
message MediaRetried {
  enum Result {
    RESULT_UNSPECIFIED = 0;
    // Uploaded again: `direct_path` is where WhatsApp's server has it now.
    SUCCESS = 1;
    // The phone no longer has the file.
    NOT_FOUND = 2;
    // The phone couldn't read what it was asked.
    DECRYPTION_ERROR = 3;
    GENERAL_ERROR = 4;
    // The engine has no key to read the answer with, as when it was started again after asking.
    UNREADABLE = 5;
  }
  // The message's ID, chat, sender in a group, and whether it's yours, as the answer names them.
  string id = 1;
  string chat = 2;
  string sender = 3;
  bool from_me = 4;
  Result result = 5;
  string direct_path = 6;
  int64 timestamp_ms = 7;
}

// A made-up message for measuring the link, sent with a seq like a real one.
message Bench {
  bytes payload = 1;
}

// jawd has stored the event with this seq.
message Ack {
  uint64 seq = 1;
}

// ---------------------------------------------------------------- from jawd

message Command {
  oneof kind {
    Ping ping = 1;
    LinkStart link_start = 2;
    LinkCancel link_cancel = 3;
    Logout logout = 4;
    HistoryDownload history_download = 5;
    BenchRun bench_run = 6;
    Groups groups = 7;
    Contacts contacts = 8;
    LidLookup lid_lookup = 9;
    AppStateResync app_state_resync = 10;
    Avatar avatar = 11;
    HistoryRequest history_request = 12;
    Send send = 13;
    MarkRead mark_read = 14;
    ChatPresence chat_presence = 15;
    Presence presence = 16;
    OnWhatsApp on_whatsapp = 17;
    AppStatePatch app_state_patch = 18;
    PollVote poll_vote = 19;
    SubscribePresence subscribe_presence = 20;
    UserInfo user_info = 21;
    MediaDownload media_download = 22;
    MediaCancel media_cancel = 23;
    MediaRetry media_retry = 24;
  }
}

// Downloads and decrypts one file to `path`, which jawd names, and answers with MediaFile. It's
// streamed to a partial file beside `path` and never held in memory, its plaintext checked against
// `file_sha256`, synced, and put in place under `path` only once it's whole, never over a file
// already there. MediaProgress events say how far it has got, and MediaCancel stops it.
message MediaDownload {
  // Which of WhatsApp's keys it's encrypted with: a sticker's are a photo's.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    IMAGE = 1;
    VIDEO = 2;
    AUDIO = 3;
    DOCUMENT = 4;
  }
  // Names the download for MediaCancel and MediaProgress.
  string id = 1;
  Kind kind = 2;
  string direct_path = 3;
  bytes media_key = 4;
  bytes file_sha256 = 5;
  bytes file_enc_sha256 = 6;
  // The file's size as its message gives it, for progress and the room it needs.
  uint64 size = 7;
  string path = 8;
  // Flush the file and its folder to the disk in full, rather than fence them with a barrier: jawd
  // asks it when jaw's folder isn't all on the Mac's own drive, where a barrier orders nothing.
  bool full_flush = 9;
}

// Stops download `id`, which answers CANCELLED; Done whether it was running or not.
message MediaCancel {
  string id = 1;
}

// Asks the phone to upload a message's file again, once WhatsApp's server no longer has it (the
// download answered GONE); Done once it's asked. The answer comes as a MediaRetried event, which
// the engine reads with `media_key`, kept until then.
message MediaRetry {
  // The message's chat and ID as WhatsApp named them, its sender in a group, and whether it's yours.
  string chat = 1;
  string sender = 2;
  bool from_me = 3;
  string id = 4;
  bytes media_key = 5;
}

// Sends a message with the ID jawd made for it, which WhatsApp then knows it by; answered with Sent
// once the server has it. Sending the same ID again is the same message to WhatsApp.
message Send {
  string chat = 1;
  string id = 2;
  // WAWebProtobufsE2E.Message.
  bytes raw = 3;
}

// Votes in a poll, as a message with the ID jawd made for the vote, which WhatsApp then knows it by;
// answered with Sent once the server has it. The engine encrypts the vote with the poll's secret,
// which whatsmeow keeps for every poll it has received or sent, and stamps it with `at_ms`, so a
// vote sent again says the same; sending the same ID again is the same vote to WhatsApp.
message PollVote {
  string chat = 1;
  // The vote's own ID.
  string id = 2;
  // The poll's ID, and who sent it as WhatsApp named them; empty when it's yours.
  string poll_id = 3;
  string poll_sender = 4;
  bool poll_from_me = 5;
  // SHA-256 of each chosen option's name, as a vote names an option; none takes a vote back.
  repeated bytes options = 6;
  int64 at_ms = 7;
}

// Tells WhatsApp these messages from `sender` in `chat` are read; whatsmeow makes it read-self when
// read receipts are off on the phone, so only your own devices hear. Done once it's sent.
message MarkRead {
  string chat = 1;
  // Who sent them, in a group; empty in a one-to-one chat.
  string sender = 2;
  repeated string ids = 3;
  int64 at_ms = 4;
}

// Typing, recording or stopped, in one chat. Done once it's sent.
message ChatPresence {
  enum State {
    STATE_UNSPECIFIED = 0;
    COMPOSING = 1;
    RECORDING = 2;
    PAUSED = 3;
  }
  string chat = 1;
  State state = 2;
}

// Online or away for everyone. Done once it's sent.
message Presence {
  bool available = 1;
}

// One app-state mutation, which your other devices then apply as if it were made on them, such as
// a message deleted for you; Done once WhatsApp has it. jawd builds the mutation, and the engine
// encrypts it with the app-state keys whatsmeow keeps. Sending one again sets the same again.
message AppStatePatch {
  // The collection: regular, regular_low, regular_high, critical_block or critical_unblock_low.
  string name = 1;
  // The mutation's index, such as ["deleteMessageForMe", chat, id, "1", "0"].
  repeated string index = 2;
  int32 version = 3;
  // WAWebProtobufSyncAction.SyncActionValue.
  bytes value = 4;
}

// Which of these phone numbers (digits only) are on WhatsApp; answered with OnWhatsAppList.
// Asks WhatsApp to send someone's presence while the account is online, for as long as the
// connection lasts; jawd keeps to its limits.
message SubscribePresence {
  string jid = 1;
}

// Asks WhatsApp what these people say of themselves, at most 50 at a time; answered with
// UserInfoList, which leaves out those it doesn't answer for.
message UserInfo {
  repeated string jids = 1;
}

message OnWhatsApp {
  repeated string phones = 1;
}

// Every group the account is in, from WhatsApp; answered with GroupList.
message Groups {}

// The contacts and push names whatsmeow keeps, with the LID of each phone number it knows, read
// from session.db; answered with ContactList.
message Contacts {}

// The phone number whatsmeow's LID map has for each of these LIDs; answered with LidPairs.
message LidLookup {
  repeated string lids = 1;
}

// Fetches app-state collections again in full from version 0, sending each mutation as an AppState
// event; Done once they're all sent.
message AppStateResync {
  // regular, regular_low, regular_high, critical_block, critical_unblock_low.
  repeated string names = 1;
}

// Downloads a user's or group's picture to `path`, unless its ID is still `existing_id`; answered
// with AvatarFile.
message Avatar {
  string jid = 1;
  string existing_id = 2;
  string path = 3;
  bool community = 4;
}

// Asks the phone for `count` messages from before the oldest jaw has in a chat. They come as a
// history notification of type ON_DEMAND; Done once the request is sent.
message HistoryRequest {
  string chat = 1;
  string oldest_id = 2;
  bool oldest_from_me = 3;
  int64 oldest_ms = 4;
  uint32 count = 5;
}

message Ping {}

// Links an account: by QR code, or by a code typed on the phone when `phone` is given.
message LinkStart {
  // The phone number, in international form with no plus or spaces.
  string phone = 1;
}

message LinkCancel {}

message Logout {}

// Downloads one history blob, from the HistorySyncNotification inside a message jawd stored, and
// writes the decompressed HistorySync to `path`.
message HistoryDownload {
  // WAWebProtobufsE2E.HistorySyncNotification.
  bytes notification = 1;
  string path = 2;
}

// Sends `count` Bench events of `size` bytes, each waiting for its Ack as a message does.
message BenchRun {
  uint32 count = 1;
  uint32 size = 2;
}

message Reply {
  oneof kind {
    Failure failure = 1;
    Done done = 2;
    Pong pong = 3;
    HistoryFile history_file = 4;
    BenchResult bench_result = 5;
    GroupList group_list = 6;
    ContactList contact_list = 7;
    LidPairs lid_pairs = 8;
    AvatarFile avatar_file = 9;
    Sent sent = 10;
    OnWhatsAppList on_whatsapp_list = 11;
    UserInfoList user_info_list = 12;
    MediaFile media_file = 13;
  }
}

message UserInfoList {
  repeated User users = 1;
}

// What WhatsApp says of someone: their about text (empty when they have none or hide it), their
// picture's ID, a business's verified name, and their LID.
message User {
  string jid = 1;
  string about = 2;
  string picture_id = 3;
  string verified_name = 4;
  string lid = 5;
}

// What became of a MediaDownload. A failure that may pass (the network, the server) is a Failure
// with `retry` instead.
message MediaFile {
  enum State {
    STATE_UNSPECIFIED = 0;
    // Written to the path asked for, whole and synced.
    PLACED = 1;
    // A file was already at the path, and, named by its content, it's this one.
    EXISTS = 2;
    // WhatsApp's server no longer has it (403, 404 or 410): the phone can be asked (MediaRetry).
    GONE = 3;
    // What came doesn't match the message's hashes or its MAC.
    BAD_HASH = 4;
    // The disk is full, or too full for the file.
    NO_SPACE = 5;
    CANCELLED = 6;
  }
  State state = 1;
  // The file's size, once it's in place.
  uint64 bytes = 2;
  // What happened, as a sentence jawd can pass on.
  string message = 3;
}

// The server has a message Send sent.
message Sent {
  string id = 1;
  // The server's time for it.
  int64 at_ms = 2;
  // The JID WhatsApp delivered it to, which for a phone number is often its LID.
  string chat = 3;
}

message OnWhatsAppList {
  repeated OnWhatsAppUser users = 1;
}

message OnWhatsAppUser {
  // The number as it was asked about.
  string query = 1;
  bool is_in = 2;
  // Their JID as WhatsApp gives it, often a LID, and their phone number's.
  string jid = 3;
  string phone = 4;
  string verified_name = 5;
}

message GroupList {
  repeated GroupInfo groups = 1;
}

message ContactList {
  repeated Contact contacts = 1;
}

// whatsmeow's types.ContactInfo for a JID.
message Contact {
  string jid = 1;
  string first_name = 2;
  string full_name = 3;
  string push_name = 4;
  string business_name = 5;
  // Their LID, for a phone number whatsmeow's LID map knows.
  string lid = 6;
}

message LidPairs {
  repeated LidPair pairs = 1;
}

message LidPair {
  string lid = 1;
  string phone = 2;
}

message AvatarFile {
  enum State {
    STATE_UNSPECIFIED = 0;
    // Written to the path asked for.
    DOWNLOADED = 1;
    // Its ID is still the one jawd has.
    UNCHANGED = 2;
    // There's none, or it's hidden from this account.
    NONE = 3;
  }
  State state = 1;
  string id = 2;
  uint64 bytes = 3;
}

message Failure {
  // A sentence jawd can pass on as it is.
  string message = 1;
  // Whether trying again later might work.
  bool retry = 2;
}

message Done {}

message Pong {
  int64 at_ms = 1;
}

message HistoryFile {
  string path = 1;
  // WAWebProtobufsHistorySync.HistorySync.HistorySyncType.
  int32 type = 2;
  uint32 chunk_order = 3;
  uint32 progress = 4;
  uint64 bytes = 5;
  uint32 conversations = 6;
}

// Round trips as the engine measured them, from sending each Bench event to its Ack.
message BenchResult {
  uint32 count = 1;
  uint64 elapsed_us = 2;
  uint64 p50_us = 3;
  uint64 p99_us = 4;
  uint64 max_us = 5;
}
