[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/pdcgomes/jaw"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
crossbeam-channel = "0.5"
fast_image_resize = "6"
emojis = "0.8"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-encoder = "0.7"
libc = "0.2"
nucleo-matcher = "0.3"
ogg = "0.9"
opus = "0.4"
png = "0.18"
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
qrcode = { version = "0.14", default-features = false }
ratatui = "0.30"
rtrb = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
# TLS for link previews, with ring as its one provider and Mozilla's roots compiled in.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
webpki-roots = "1"
zstd = { version = "0.14", default-features = false }

jaw-client = { path = "crates/jaw-client" }
jaw-media = { path = "crates/jaw-media" }
jaw-proto = { path = "crates/jaw-proto" }
wa-proto = { path = "crates/wa-proto" }

# Dependencies optimised in debug builds too, so the timing tests the gate runs in debug measure
# jaw's code rather than unoptimised SQLite, zstd and ratatui.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
