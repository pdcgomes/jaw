[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/pdcgomes/jaw"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

jaw-client = { path = "crates/jaw-client" }
jaw-proto = { path = "crates/jaw-proto" }
wa-proto = { path = "crates/wa-proto" }

[profile.release]
lto = "thin"
codegen-units = 1
