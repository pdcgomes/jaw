# Every migration in schema.rs: its number, its kind and the SHA-256 of its text. jawd refuses to
# run a migration whose text doesn't match its line, so a merged migration is never edited.
#
# To add a migration: append its text to MIGRATIONS in schema.rs, then add a line here below the
# last, numbered one more than it, with its kind and its hash:
#   schema  costs the same however big the database is (tables, triggers, indexes on small tables,
#           a nullable column); runs of them go in one transaction at start
#   data    costs time in proportion to the rows (rebuilding a table, an index on messages, an
#           UPDATE of every row); runs in a transaction of its own, after jaw.db is backed up
# `cargo test -p jawd migration` prints the hash to copy. Branches don't keep their numbers: when
# a branch merges after another that added migrations, its migrations move after theirs in
# MIGRATIONS and its lines take the next free numbers, so no two lines share one.
